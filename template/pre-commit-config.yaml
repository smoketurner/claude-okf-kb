repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: okf-validate
        name: okf validate (staged)
        entry: uv run scripts/okf.py validate --staged
        language: system
        files: '\.md$'
        pass_filenames: false
